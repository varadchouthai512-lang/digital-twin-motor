# ================================================================
#  Telegraf Configuration
#  Digital Twin — OS-PRO AC Motor
#  MIT-WPU TY B.Tech EEE 2025-26
# ================================================================
#  Role: Bridge MQTT messages → InfluxDB
#
#  Usage:
#    telegraf --config motor.conf
#
#  Before running:
#    Replace REPLACE_WITH_YOUR_INFLUXDB_TOKEN below
# ================================================================

[agent]
  interval            = "1s"
  flush_interval      = "1s"
  metric_batch_size   = 1000
  metric_buffer_limit = 10000
  quiet               = false
  hostname            = "motor-twin-host"

# ── INPUT: MQTT Subscriber ────────────────────────────────────
[[inputs.mqtt_consumer]]
  # Mosquitto broker
  servers = ["tcp://localhost:1883"]

  # Motor state topic from ESP32
  topics = ["plantA/line1/motor_01/state"]

  # Parse JSON payload
  data_format       = "json"
  json_time_key     = "timestamp"
  json_time_format  = "unix"

  # Status is a string field (not numeric)
  json_string_fields = ["status"]

  # Tag every datapoint with asset metadata
  [inputs.mqtt_consumer.tags]
    asset_id = "motor_01"
    plant    = "A"
    line     = "1"
    motor    = "ospro_230v_ac"

# ── OUTPUT: InfluxDB v2 ───────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["http://localhost:8086"]
  token        = "REPLACE_WITH_YOUR_INFLUXDB_TOKEN"
  organization = "mit-wpu"
  bucket       = "motor_data"
